name: CI and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Test
        run: |
          set -euo pipefail
          xcodebuild test \
            -project AccountDock.xcodeproj \
            -scheme AccountDock \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Validate tag and project version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(awk -F'"' '/^[[:space:]]*MARKETING_VERSION:/ {print $2; exit}' project.yml)"
          test "$TAG_VERSION" = "$PROJECT_VERSION"
      - name: Build release app
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild build \
            -project AccountDock.xcodeproj \
            -scheme AccountDock \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO
      - name: Package release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          pkgbuild \
            --component "$RUNNER_TEMP/DerivedData/Build/Products/Release/AccountDock.app" \
            --install-location /Applications \
            "$RUNNER_TEMP/release/AccountDock.pkg"
          cd "$RUNNER_TEMP/release"
          /usr/bin/shasum -a 256 AccountDock.pkg > AccountDock.pkg.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/release/AccountDock.pkg" \
            "$RUNNER_TEMP/release/AccountDock.pkg.sha256" \
            --verify-tag \
            --generate-notes \
            --title "AccountDock $GITHUB_REF_NAME"
