name: AccountDock
options:
  bundleIdPrefix: app.accountdock
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  developmentLanguage: en
  knownRegions:
    - en
    - zh-Hans
    - ja
    - de
    - fr

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: true
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 584KQTRF3B
    APP_GROUP_IDENTIFIER: $(DEVELOPMENT_TEAM).app.accountdock
    SWIFT_STRICT_CONCURRENCY: targeted

targets:
  AccountDock:
    type: application
    platform: macOS
    sources:
      - path: AccountDock
        excludes:
          - Resources/AppIcon.png
          - Resources/MenuBarIcon.png
      - path: Shared
    info:
      path: AccountDock/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: app.accountdock
            CFBundleURLSchemes:
              - accountdock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.accountdock.mac
        CODE_SIGN_ENTITLEMENTS: AccountDock/Resources/AccountDock.entitlements
        PRODUCT_NAME: AccountDock
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    entitlements:
      path: AccountDock/Resources/AccountDock.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    dependencies:
      - target: AccountDockWidgetExtension
        embed: true
        codeSign: true

  AccountDockWidgetExtension:
    type: extensionkit-extension
    platform: macOS
    sources:
      - path: AccountDockWidget
      - path: Shared
    info:
      path: AccountDockWidget/Info.plist
      properties:
        CFBundleDisplayName: AccountDock Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.accountdock.mac.widget
        CODE_SIGN_ENTITLEMENTS: AccountDockWidget/Resources/AccountDockWidget.entitlements
        PRODUCT_NAME: AccountDockWidgetExtension
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 584KQTRF3B
        SWIFT_STRICT_CONCURRENCY: targeted
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        SKIP_INSTALL: true
    entitlements:
      path: AccountDockWidget/Resources/AccountDockWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)

  AccountDockTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AccountDockTests
    dependencies:
      - target: AccountDock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.accountdock.mac.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGNING_ALLOWED: false
